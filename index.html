<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>An important question... 🐼🐻</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #ffe6e6 0%, #ffb3c6 100%);
            min-height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            text-align: center;
            position: relative;
            padding: 20px 0;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(5px);
            max-width: 450px;
            width: 90%;
            z-index: 2;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .gif {
            width: 200px;
            height: 200px;
            object-fit: contain;
            border-radius: 15px;
            margin-bottom: 20px;
            flex-shrink: 0;
        }
        h1 {
            color: #ff4d6d;
            font-size: 24px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .please-quote {
            color: #ff4d6d;
            font-size: 16px;
            font-weight: bold;
            font-style: italic;
            min-height: 24px;
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease;
        }
        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 20px 0;
            overflow: visible;
        }
        button {
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
        }
        #yesBtn {
            background-color: #ff4d6d;
            color: white;
            padding: 14px 32px;
            font-size: 18px;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), background-color 0.2s;
            transform-origin: center center;
        }
        #yesBtn:hover {
            background-color: #ff2a55;
        }
        #noBtn {
            background-color: #4a4a4a;
            color: white;
            padding: 12px 24px;
            font-size: 16px;
            position: fixed;
            z-index: 999;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: left 0.15s ease, top 0.15s ease;
            /* Fixed dimensions so shape/size never alters */
            width: 80px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .success-message {
            display: none;
        }
        .success-message h2 {
            color: #ff4d6d;
            font-size: 28px;
            margin-bottom: 10px;
        }
        .success-message p {
            color: #444;
            font-size: 18px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <img id="mainGif" class="gif" src="https://media.tenor.com/f11j0Rj5x80AAAAC/bubu-dudu-bubu.gif" alt="Bubu Dudu Cute Love">
        
        <div id="questionContent">
            <h1>Would you go on a date with me? 🥺❤️</h1>
            <div id="quoteBox" class="please-quote"></div>
            <div class="btn-container">
                <button id="yesBtn">Yes!</button>
            </div>
        </div>

        <div id="successContent" class="success-message">
            <h2>YAY! Best decision ever! 🐼🐻💋</h2>
            <p>I can't wait! Let me know when you're free! 🥰</p>
        </div>
    </div>

    <button id="noBtn">No</button>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const questionContent = document.getElementById('questionContent');
        const successContent = document.getElementById('successContent');
        const mainGif = document.getElementById('mainGif');
        const quoteBox = document.getElementById('quoteBox');

        const cuteBubuGifs = [
            "https://media.tenor.com/gU86W-qiiSgAAAAC/bubu-dudu-sseeyall.gif",
            "https://media.tenor.com/J7t6j5bYd1gAAAAC/bubu-dudu-kiss.gif",
            "https://media.tenor.com/1-P2i6x2T6wAAAAC/bubu-dudu-cuddle.gif",
            "https://media.tenor.com/00l4iZ5-s0MAAAAC/bubu-dudu-hearts.gif",
            "https://media.tenor.com/vH5tP2v6Q1IAAAAC/bubu-dudu-hug.gif"
        ];

        const quotes = [
            "You know you want to say Yes! 😘",
            "Sending extra Bubu kisses! 💋",
            "Think about all the fun & hugs! 🤗",
            "I'll buy you all your favorite food! 🍕🧋",
            "Just look how cute we'd be! ✨",
            "The Yes button is getting bigger for a reason! ❤️",
            "You can't resist this much cuteness! 🥰",
            "Press Yes and send me a kiss! 💋",
            "Resistance is futile! 😘",
            "Just hit YES already! ❤️✨"
        ];

        let clickCount = 0;
        let yesScale = 1;

        function setInitialNoPosition() {
            const yesRect = yesBtn.getBoundingClientRect();
            noBtn.style.left = (yesRect.right + 25) + 'px';
            noBtn.style.top = yesRect.top + 'px';
        }

        window.addEventListener('load', setInitialNoPosition);
        window.addEventListener('resize', setInitialNoPosition);

        function dodgeNo() {
            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;

            const padding = 20;
            const maxX = window.innerWidth - btnWidth - padding;
            const maxY = window.innerHeight - btnHeight - padding;

            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            noBtn.style.left = `${randomX}px`;
            noBtn.style.top = `${randomY}px`;

            quoteBox.innerText = quotes[clickCount % quotes.length];
            quoteBox.style.animation = 'none';
            quoteBox.offsetHeight;
            quoteBox.style.animation = 'fadeIn 0.3s ease';

            mainGif.src = cuteBubuGifs[clickCount % cuteBubuGifs.length];

            clickCount++;
            yesScale += 0.2;

            // Grow Yes button size cleanly without altering No button
            yesBtn.style.transform = `scale(${yesScale})`;
            
            // Add padding to container dynamically so large Yes button doesn't overlap text/GIF
            const containerPadding = Math.max(20, 20 * yesScale);
            document.querySelector('.btn-container').style.padding = `${containerPadding}px 0`;
        }

        noBtn.addEventListener('mouseover', dodgeNo);
        noBtn.addEventListener('click', dodgeNo);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            dodgeNo();
        });

        yesBtn.addEventListener('click', () => {
            questionContent.style.display = 'none';
            noBtn.style.display = 'none';
            successContent.style.display = 'block';
            mainGif.src = 'https://media.tenor.com/gU86W-qiiSgAAAAC/bubu-dudu-sseeyall.gif'; 
        });
    </script>
</body>
</html>
