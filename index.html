<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>An important question... 🐼🐻</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        html, body {
            height: 100vh;
            width: 100vw;
            max-height: 100vh;
            max-width: 100vw;
            overflow: hidden;
            position: relative;
        }
        body {
            background: linear-gradient(135deg, #ffe6e6 0%, #ffb3c6 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px 25px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(5px);
            max-width: 420px;
            width: 85%;
            z-index: 2;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }
        .gif {
            width: 180px;
            height: 180px;
            object-fit: contain;
            border-radius: 15px;
            margin-bottom: 15px;
            flex-shrink: 0;
        }
        h1 {
            color: #ff4d6d;
            font-size: 22px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .please-quote {
            color: #ff4d6d;
            font-size: 15px;
            font-weight: bold;
            font-style: italic;
            min-height: 24px;
            margin-bottom: 15px;
            animation: fadeIn 0.3s ease;
        }
        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 5px 0;
        }
        button {
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
        }
        #yesBtn, #confirmDateBtn {
            background-color: #ff4d6d;
            color: white;
            padding: 12px 28px;
            font-size: 17px;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 100%;
            width: auto;
            white-space: nowrap;
        }
        #yesBtn:hover, #confirmDateBtn:hover {
            background-color: #ff2a55;
        }
        #noBtn {
            background-color: #4a4a4a;
            color: white;
            padding: 12px 24px;
            font-size: 16px;
            position: absolute;
            z-index: 999;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: left 0.15s ease, top 0.15s ease;
            width: 80px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .success-message {
            display: none;
            width: 100%;
        }
        .success-message h2 {
            color: #ff4d6d;
            font-size: 24px;
            margin-bottom: 8px;
        }
        .success-message p {
            color: #444;
            font-size: 15px;
            margin-bottom: 15px;
        }
        .date-picker-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            width: 100%;
            margin-top: 10px;
        }
        input[type="date"] {
            padding: 10px 15px;
            font-size: 16px;
            border: 2px solid #ff4d6d;
            border-radius: 12px;
            outline: none;
            color: #333;
            background-color: #fff;
            width: 80%;
            text-align: center;
            font-weight: bold;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <img id="mainGif" class="gif" src="https://raw.githubusercontent.com/DzarelDeveloper/Img/main/gaskun.gif" alt="Bubu Dudu Cute Love">
        
        <div id="questionContent" style="width: 100%;">
            <h1>Would you go on a date with me? 🥺❤️</h1>
            <div id="quoteBox" class="please-quote"></div>
            <div class="btn-container">
                <button id="yesBtn">Yes!</button>
            </div>
        </div>

        <div id="successContent" class="success-message">
            <h2>YAY! Best decision ever!🐼🫀💋</h2>
            <p>Pick a date on the calendar, to go out cutie😚😉✨</p>

            <div class="date-picker-container">
                <input type="date" id="datePicker" />
                <button id="confirmDateBtn">Confirm Our Date!😚💖</button>
            </div>
        </div>
    </div>

    <button id="noBtn">No</button>

    <script>
        // -------------------------------------------------------------------
        // SET YOUR PHONE NUMBER HERE (Include Country Code, e.g., '919899316156')
        // -------------------------------------------------------------------
        const YOUR_PHONE_NUMBER = "919899316156"; 

        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const confirmDateBtn = document.getElementById('confirmDateBtn');
        const datePicker = document.getElementById('datePicker');
        const questionContent = document.getElementById('questionContent');
        const successContent = document.getElementById('successContent');
        const mainGif = document.getElementById('mainGif');
        const quoteBox = document.getElementById('quoteBox');

        // Set minimum date selector to today
        const today = new Date().toISOString().split('T')[0];
        datePicker.setAttribute('min', today);

        const cuteBubuGifs = [
            "https://raw.githubusercontent.com/DzarelDeveloper/Img/main/Ask-me.gif",
            "https://raw.githubusercontent.com/DzarelDeveloper/Img/main/gaskun.gif",
            "https://raw.githubusercontent.com/DzarelDeveloper/Img/main/hug.gif",
            "https://raw.githubusercontent.com/DzarelDeveloper/Img/main/kiss.gif"
        ];

        const quotes = [
            "You know you want to say Yes! 😘",
            "Sending extra Bubu kisses! 💋",
            "Think about all the fun & hugs! 🤗",
            "I'll buy you all your favorite food! 🍕🧋",
            "Just look how cute we'd be! ✨",
            "The Yes button is getting bigger for a reason! ❤️",
            "You can't resist this much cuteness! 🥰",
            "Press Yes and send me a kiss! 💋",
            "Resistance is futile! 😘",
            "Just hit YES already! ❤️✨"
        ];

        let clickCount = 0;
        let currentPaddingV = 12;
        let currentPaddingH = 28;
        let currentFontSize = 17;

        function setInitialNoPosition() {
            const yesRect = yesBtn.getBoundingClientRect();
            noBtn.style.left = (yesRect.right + 20) + 'px';
            noBtn.style.top = yesRect.top + 'px';
        }

        window.addEventListener('load', setInitialNoPosition);
        window.addEventListener('resize', setInitialNoPosition);

        function dodgeNo() {
            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;

            const padding = 15;
            const maxX = window.innerWidth - btnWidth - padding;
            const maxY = window.innerHeight - btnHeight - padding;

            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            noBtn.style.left = `${randomX}px`;
            noBtn.style.top = `${randomY}px`;

            quoteBox.innerText = quotes[clickCount % quotes.length];
            quoteBox.style.animation = 'none';
            quoteBox.offsetHeight;
            quoteBox.style.animation = 'fadeIn 0.3s ease';

            mainGif.src = cuteBubuGifs[clickCount % cuteBubuGifs.length];

            clickCount++;

            const cardWidth = document.getElementById('mainCard').offsetWidth - 50;
            if (yesBtn.offsetWidth < cardWidth) {
                currentPaddingV += 2.5;
                currentPaddingH += 6;
                currentFontSize += 1.2;
                
                yesBtn.style.padding = `${currentPaddingV}px ${currentPaddingH}px`;
                yesBtn.style.fontSize = `${currentFontSize}px`;
            } else {
                yesBtn.style.width = '100%';
            }
        }

        noBtn.addEventListener('mouseover', dodgeNo);
        noBtn.addEventListener('click', dodgeNo);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            dodgeNo();
        });

        yesBtn.addEventListener('click', () => {
            questionContent.style.display = 'none';
            noBtn.style.display = 'none';
            successContent.style.display = 'block';
            mainGif.src = 'https://raw.githubusercontent.com/DzarelDeveloper/Img/main/kiss.gif'; 
        });

        // WhatsApp Redirect Handler
        confirmDateBtn.addEventListener('click', () => {
            const selectedDate = datePicker.value;

            if (!selectedDate) {
                alert("Please select a date on the calendar first! 📅❤️");
                return;
            }

            // Flirty, romantic text payload
            const romanticText = `Hey cutie! 😘💖\n\nMark your calendar for ${selectedDate} because you're taking me out on our date my love🧿🫀. You better be ready to steal my heart (and maybe a few kisses 🔥😉🫣🫣)!\n\nCan't wait! 💋✨`;
            
            const encodedMessage = encodeURIComponent(romanticText);
            const whatsappUrl = `https://wa.me/${YOUR_PHONE_NUMBER}?text=${encodedMessage}`;

            window.open(whatsappUrl, '_blank');
        });
    </script>
</body>
</html>
